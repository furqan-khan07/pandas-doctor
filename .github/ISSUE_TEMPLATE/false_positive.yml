name: False positive or wrong rewrite
description: pandas-doctor flagged code that's fine, or suggested a rewrite that isn't equivalent
labels: ["false positive"]
body:
  - type: textarea
    id: snippet
    attributes:
      label: The code
      description: The smallest snippet that shows it. Include how the data is built if it matters.
      render: python
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What pandas-doctor printed
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Why it's wrong
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `pandas-doctor --version`, plus pandas and Python versions
