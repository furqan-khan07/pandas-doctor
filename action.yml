name: pandas-doctor
description: Find slow pandas code in pull requests (iterrows loops, row-wise apply, concat in loops, ...)
author: Furqan Khan
branding:
  icon: activity
  color: blue

inputs:
  paths:
    description: Files or folders to check, space-separated
    default: "."
  args:
    description: Extra arguments for `pandas-doctor check` (e.g. --select PDD001,PDD003)
    default: ""
  comment:
    description: Post (and keep updating) one summary comment on the pull request
    default: "true"
  fail-on-findings:
    description: Fail the job when slow patterns are found (info findings never fail it)
    default: "false"
  python-version:
    description: Python used to run pandas-doctor
    default: "3.12"

outputs:
  findings:
    description: Number of slow patterns found
    value: ${{ steps.check.outputs.findings }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install pandas-doctor
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"

    - name: Check
      id: check
      shell: bash
      run: |
        pandas-doctor check ${{ inputs.paths }} ${{ inputs.args }} --format json --exit-zero > "$RUNNER_TEMP/pdd.json"
        python -m pandas_doctor.github "$RUNNER_TEMP/pdd.json" --annotate > "$RUNNER_TEMP/pdd.md"
        cat "$RUNNER_TEMP/pdd.md" >> "$GITHUB_STEP_SUMMARY"
        echo "findings=$(python -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["findings"]))' "$RUNNER_TEMP/pdd.json")" >> "$GITHUB_OUTPUT"
        echo "failing=$(python -c 'import json,sys; print(sum(f["severity"] != "info" for f in json.load(open(sys.argv[1]))["findings"]))' "$RUNNER_TEMP/pdd.json")" >> "$GITHUB_OUTPUT"

    - name: Comment on the pull request
      if: github.event_name == 'pull_request' && inputs.comment == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        # one sticky comment, updated on every push (needs `pull-requests: write`)
        existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
          --jq '[.[] | select(.body | startswith("<!-- pandas-doctor -->"))][0].id // empty')
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@"$RUNNER_TEMP/pdd.md" > /dev/null
        else
          gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$RUNNER_TEMP/pdd.md" > /dev/null
        fi

    - name: Fail on findings
      if: inputs.fail-on-findings == 'true' && steps.check.outputs.failing != '0'
      shell: bash
      run: |
        echo "pandas-doctor found ${{ steps.check.outputs.failing }} slow pandas pattern(s)."
        exit 1
